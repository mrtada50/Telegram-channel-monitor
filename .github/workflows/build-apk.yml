name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed only for the optional release step on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      # Fixed signing key from repository secrets: updates install over the old app without uninstalling.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app.keystore"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/app.keystore"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$K_ALIAS"
              echo "KEY_PASSWORD=$K_PASS"
            } >> "$GITHUB_ENV"
            echo "Using the fixed signing key."
          else
            echo "::error::Signing secrets are missing (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Stopping so the app is never signed with a random key."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK" || { echo "APK not found"; exit 1; }
          ls -l "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Show signing certificate (must be identical in every build)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK_PATH" | grep -i "SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-channel-monitor-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Optimized build: much smoother than debug. Allowed to fail without breaking the debug build.
      - name: Assemble release APK (R8, debug-signed)
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-channel-monitor-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # Optional: push a tag like v0.1.0 to publish the debug APK as a GitHub Release.
      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
